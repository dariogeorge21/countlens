<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" role="img" aria-label="COUNTLENS logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="cl-g" x1="40" y1="216" x2="216" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="#0B0B10"/>
  <!-- Lens ring with an aperture gap -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#cl-g)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="480 73" transform="rotate(-21.3 128 128)"/>
  <!-- Lens glint in the gap -->
  <circle cx="190.2" cy="65.8" r="7" fill="#22D3EE"/>
  <!-- The count: a single tally stroke, with neighbouring values rolling above and below -->
  <rect x="120" y="84" width="16" height="88" rx="8" fill="url(#cl-g)"/>
  <circle cx="128" cy="64" r="5" fill="#FFFFFF" fill-opacity="0.4"/>
  <circle cx="128" cy="192" r="5" fill="#FFFFFF" fill-opacity="0.4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
